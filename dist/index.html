.who b{font-family:"Iowan Old Style",Georgia,serif;font-size:16px;letter-spacing:.3px}
.xpbar{height:6px;border-radius:4px;background:#2c2333;overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#e8b85a,#ffdf9a);border-radius:4px;transition:width .5s}
.res{display:flex;gap:6px;flex:none}
.pill{display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:20px;background:#0006;border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap}
.daybar{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--mut)}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px 12px 24px;position:relative;z-index:1}
#tabs{display:flex;background:#100c14ee;border-top:1px solid var(--line);padding:6px 4px calc(var(--sab) + 6px);z-index:3;backdrop-filter:blur(8px)}
#tabs button{flex:1;background:none;border:0;color:var(--mut);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;position:relative}
#tabs button .ic{font-size:22px;filter:grayscale(.6);transition:.2s}
#tabs button.on{color:var(--gold2)}
#tabs button.on .ic{filter:none;transform:translateY(-2px) scale(1.08)}
.badge{position:absolute;top:0;right:22%;min-width:16px;height:16px;border-radius:8px;background:var(--blood);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 8px #c22a3a}
h2.t{font-family:"Iowan Old Style",Georgia,serif;font-size:20px;margin:6px 2px 10px;color:var(--gold2);letter-spacing:.5px;display:flex;align-items:center;gap:8px}
h3.t{font-family:"Iowan Old Style",Georgia,serif;font-size:16px;margin:14px 2px 8px;color:var(--gold);letter-spacing:.4px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 6px 18px #0006,inset 0 1px 0 #ffffff0d;position:relative}
.card.glow{border-color:#e8b85a66;box-shadow:0 0 0 1px #e8b85a22,0 6px 22px #e8b85a1f}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:6px}
.grow{flex:1;min-width:0}
.mut{color:var(--mut);font-size:12.5px}
.small{font-size:12px}
.btn{appearance:none;border:1px solid #6b5326;background:linear-gradient(180deg,#f2c86a,#c08a2e);color:#1d1206;font-weight:800;border-radius:11px;padding:10px 14px;font-size:14px;box-shadow:0 3px 0 #7a5418,0 6px 14px #0007;letter-spacing:.2px;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7a5418}
.btn.sec{background:linear-gradient(180deg,#3a2f46,#2a2134);color:var(--txt);border-color:#4d3f5c;box-shadow:0 3px 0 #18121e,0 6px 14px #0006}
.btn.red{background:linear-gradient(180deg,#e2475a,#9d1b2c);color:#fff;border-color:#5c0e18;box-shadow:0 3px 0 #5c0e18}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.wide{width:100%}
.btn:disabled{filter:grayscale(1) brightness(.6)}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.tile{background:linear-gradient(180deg,#2a2233,#1e1826);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;position:relative;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tile .em{font-size:28px;line-height:1}
.tile .nm{font-size:11.5px;line-height:1.15}
.tile .q{position:absolute;top:4px;right:6px;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}.r4{color:var(--r4)}.r5{color:var(--r5)}
.b0{border-color:#6e6a62!important}.b1{border-color:#3c8f44!important;box-shadow:inset 0 0 14px #5fd06822}.b2{border-color:#2d6fb3!important;box-shadow:inset 0 0 14px #4aa3ff2a}.b3{border-color:#7b3fbf!important;box-shadow:inset 0 0 16px #b266ff33}.b4{border-color:#d08b17!important;box-shadow:inset 0 0 18px #ffb73344,0 0 10px #ffb73333}.b5{border-color:#e0314f!important;box-shadow:inset 0 0 20px #ff4d6d55,0 0 14px #ff4d6d44;animation:mythpulse 2s infinite}
@keyframes mythpulse{50%{box-shadow:inset 0 0 26px #ff4d6d88,0 0 22px #ff4d6d66}}
.tabs2{display:flex;gap:6px;overflow-x:auto;margin:0 -2px 10px;padding:2px;scrollbar-width:none}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{flex:none;border:1px solid var(--line);background:#1d1724;color:var(--mut);padding:7px 12px;border-radius:20px;font-size:13px;font-weight:600}
.tabs2 button.on{background:linear-gradient(180deg,#3d2f22,#2a2016);color:var(--gold2);border-color:#7a5a2a}
.prog{height:8px;background:#2b2333;border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#5fd068,#a8f0a0);transition:width .4s}
.prog.h i{background:linear-gradient(90deg,#ff5d8f,#ffb0c8)}
/* plots */
.plots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.plot{aspect-ratio:1;border-radius:12px;background:radial-gradient(circle at 50% 60%,#4a3322,#2d1f15);border:1px solid #5a4030;position:relative;display:grid;place-items:center;font-size:30px;box-shadow:inset 0 -6px 12px #0006}
.plot.wet{background:radial-gradient(circle at 50% 60%,#3a2a1e,#1f1610);border-color:#3f6d8a;box-shadow:inset 0 -6px 12px #0008,0 0 0 1px #4aa3ff33}
.plot.ready{animation:ready 1.6s infinite;border-color:#e8b85a}
.plot.lock{background:#141018;border-style:dashed;font-size:16px;color:#5c5266}
.plot .st{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:10px;color:#e9dcc9;text-shadow:0 1px 2px #000}
.plot .mutf{position:absolute;top:2px;right:4px;font-size:12px}
@keyframes ready{50%{box-shadow:inset 0 -6px 12px #0006,0 0 16px #e8b85a88}}
/* hero banner */
.banner{border-radius:16px;overflow:hidden;position:relative;margin-bottom:10px;border:1px solid var(--line);box-shadow:0 8px 24px #0008}
.banner svg{display:block;width:100%;height:auto}
.banner .ov{position:absolute;left:12px;bottom:10px;right:12px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.qb{background:linear-gradient(180deg,#2a2233,#1c1623);border:1px solid var(--line);border-radius:14px;padding:9px 4px 7px;text-align:center;position:relative;color:var(--txt)}
.qb .em{font-size:26px;display:block;line-height:1.1}
.qb span{font-size:11px;color:var(--mut)}
.qb .badge{right:8px;top:4px}
/* overlay */
#ov{position:fixed;inset:0;z-index:50;pointer-events:none}
.modal{position:absolute;inset:0;background:#05030880;backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;pointer-events:auto;animation:fadein .2s}
.modal.center{align-items:center}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:linear-gradient(180deg,#221b2b,#16111c);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:16px 14px calc(var(--sab) + 16px);animation:up .25s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 -10px 40px #000a}
.center .sheet{border-radius:20px;border:1px solid var(--line);max-width:400px;width:92%;animation:pop .3s cubic-bezier(.2,.9,.3,1.3)}
.sheet .x{position:sticky;top:-6px;float:right;background:#0007;border:1px solid var(--line);color:var(--txt);width:30px;height:30px;border-radius:50%;font-size:16px;z-index:2}
@keyframes up{from{transform:translateY(100%)}}
@keyframes pop{from{transform:scale(.7);opacity:0}}
@keyframes fadein{from{opacity:0}}
.full{position:absolute;inset:0;pointer-events:auto;background:var(--bg);display:flex;flex-direction:column;animation:fadein .25s}
#toasts{position:fixed;top:calc(var(--sat) + 70px);left:0;right:0;z-index:90;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#1e1726f2;border:1px solid var(--line);padding:9px 14px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 8px 20px #000a;animation:tin .3s, tout .4s 2.3s forwards;max-width:90%;text-align:center}
.toast.gold{border-color:#e8b85a;color:var(--gold2)}.toast.bad{border-color:#c22a3a}.toast.leg{border-color:var(--r4);color:var(--r4);box-shadow:0 0 20px #ffb73366}
@keyframes tin{from{transform:translateY(-20px);opacity:0}}
@keyframes tout{to{transform:translateY(-10px);opacity:0}}
/* dialogue */
.vn{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.vn .bg{position:absolute;inset:0;transition:background 1s}
.vn .stage{position:absolute;left:0;right:0;bottom:0;top:calc(var(--sat) + 10px);display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.vn .por{position:absolute;bottom:calc(var(--sab) + 150px);width:min(92vw,430px);transition:transform .35s cubic-bezier(.2,.9,.3,1.2),opacity .3s,filter .3s}
.vn .por svg{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 30px #000c)}
.vn .por.in{animation:porin .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes porin{from{transform:translateY(30px);opacity:0}}
.vn .box{position:relative;margin:0 10px calc(var(--sab) + 12px);background:linear-gradient(180deg,#1d1625f5,#120d17f8);border:1px solid #5a4630;border-radius:16px;padding:16px 16px 14px;min-height:150px;box-shadow:0 -6px 30px #000c,inset 0 0 0 1px #ffffff08;z-index:2}
.vn .nm{position:absolute;top:-15px;left:16px;padding:4px 14px;border-radius:10px;font-family:"Iowan Old Style",Georgia,serif;font-weight:700;font-size:15px;color:#1a1008;background:linear-gradient(180deg,#ffe3a0,#d9a443);box-shadow:0 4px 10px #0008;letter-spacing:.4px}
.vn .tx{font-size:16.5px;line-height:1.5;font-family:"Iowan Old Style",Georgia,serif;min-height:74px}
.vn .tx.narr{font-style:italic;color:#d8cfc0}
.vn .nx{position:absolute;right:14px;bottom:8px;font-size:12px;color:var(--gold);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.vn .chs{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.vn .chs button{text-align:left;background:linear-gradient(180deg,#2d2238,#211a29);color:var(--txt);border:1px solid #6b5326;border-radius:12px;padding:11px 12px;font-size:15px;font-family:"Iowan Old Style",Georgia,serif}
.vn .chs button:active{background:#3d2f22}
.vn .skip{position:absolute;top:calc(var(--sat) + 10px);right:12px;z-index:3;background:#0008;border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:6px 12px;font-size:12px}
.shake{animation:shake .5s}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,2px)}40%,60%{transform:translate(6px,-1px)}}
.flash{position:absolute;inset:0;background:#fff;animation:flash .8s forwards;pointer-events:none;z-index:5}
@keyframes flash{from{opacity:1}to{opacity:0}}
/* brew */
.cauldron-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.meter{position:relative;width:100%;height:46px;border-radius:12px;background:#120e16;border:1px solid var(--line);overflow:hidden}
.meter .z{position:absolute;top:0;bottom:0}
.meter .needle{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 10px #fff,0 0 20px var(--ember);border-radius:2px}
.bubbles{position:relative;width:200px;height:170px}
.res-pop{text-align:center;animation:pop .4s}
/* chest */
.chest-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;position:relative;overflow:hidden}
.chest-stage .rays{position:absolute;width:900px;height:900px;left:50%;top:44%;margin:-450px 0 0 -450px;opacity:0;transition:opacity .5s;animation:spin 14s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.chest-svg{width:200px;transition:filter .4s;position:relative;z-index:2}
.chest-svg.shake{animation:cshake .35s infinite}
@keyframes cshake{25%{transform:rotate(-4deg) scale(1.03)}75%{transform:rotate(4deg) scale(1.03)}}
.loot{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;position:relative;z-index:2;max-width:480px}
.loot .tile{width:96px;animation:flipin .45s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes flipin{from{transform:rotateY(90deg) scale(.6);opacity:0}}
.legend-banner{font-family:"Iowan Old Style",Georgia,serif;font-size:30px;font-weight:800;letter-spacing:2px;text-align:center;background:linear-gradient(180deg,#fff6d0,#ffb733 50%,#b86a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #ffb733aa);animation:pop .5s cubic-bezier(.2,.9,.3,1.5)}
.legend-banner.m{background:linear-gradient(180deg,#ffe0e8,#ff4d6d 50%,#8a0a2a);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 16px #ff4d6daa)}
/* wheel */
.wheel-box{position:relative;width:min(84vw,330px);aspect-ratio:1;margin:10px auto}
.wheel-box svg.w{width:100%;height:100%;transition:transform 5.2s cubic-bezier(.12,.75,.12,1)}
.wheel-box .ptr{position:absolute;top:-8px;left:50%;margin-left:-14px;width:28px;height:36px;z-index:2;filter:drop-shadow(0 3px 4px #000)}
/* cards game */
.gw{position:absolute;inset:0;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 50%,#2a2013 0%,#140f0a 70%);pointer-events:auto;padding-top:var(--sat);padding-bottom:var(--sab)}
.gw .side{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12.5px}
.gw .lives i{display:inline-block;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a9a,#c22a3a);margin-right:3px;box-shadow:0 0 6px #c22a3a}
.gw .lives i.off{background:#3a2c2c;box-shadow:none}
.gw .tot{font-weight:900;font-size:20px;min-width:34px;text-align:center;border-radius:50%;background:#0006;border:1px solid #6b5326;height:34px;line-height:32px;color:var(--gold2)}
.gw .rows{flex:1;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 6px}
.gw .rw{display:flex;align-items:center;gap:4px;min-height:58px;background:#0003;border-radius:10px;border:1px solid #3b2d1e;padding:3px;position:relative}
.gw .rw.wthr{background:linear-gradient(90deg,#9fd4ff22,#0003);border-color:#4aa3ff66}
.gw .rw .rs{width:26px;text-align:center;font-weight:800;font-size:13px;color:var(--gold2);flex:none}
.gw .rw .rc{display:flex;gap:3px;overflow-x:auto;flex:1;scrollbar-width:none}
.gw .rw .rc::-webkit-scrollbar{display:none}
.gw .rw.tgt{border-color:#5fd068;box-shadow:0 0 10px #5fd06866}
.gw .rw .horn{position:absolute;right:4px;top:2px;font-size:12px}
.gw .mid{height:2px;background:linear-gradient(90deg,transparent,#e8b85a,transparent);margin:3px 0}
.mc{flex:none;width:40px;height:52px;border-radius:7px;background:linear-gradient(180deg,#3a2c1e,#21180f);border:1.5px solid #6b5326;position:relative;display:grid;place-items:center;font-size:21px}
.mc .p{position:absolute;top:-3px;left:-3px;width:17px;height:17px;border-radius:50%;background:#f0e2c0;color:#1a1008;font-size:10.5px;font-weight:900;display:grid;place-items:center;box-shadow:0 1px 3px #000}
.mc.hero .p{background:linear-gradient(180deg,#ffe3a0,#d9a443)}
.mc.up .p{background:#5fd068}.mc.dn .p{background:#ff6b6b;color:#fff}
.mc.tgt{box-shadow:0 0 0 2px #5fd068,0 0 10px #5fd068;animation:ready 1s infinite}
.mc.new{animation:pop .3s}
.hand{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 6px;scrollbar-width:none}
.hand::-webkit-scrollbar{display:none}
.gc{flex:none;width:72px;height:104px;border-radius:10px;position:relative;background:linear-gradient(180deg,#3d2f20,#1f170e);border:2px solid #7a5a2a;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .15s;box-shadow:0 4px 10px #0008}
.gc .art{font-size:32px;line-height:1}
.gc .n{font-size:9.5px;text-align:center;line-height:1.05;padding:2px 3px 0;max-height:22px;overflow:hidden}
.gc .p{position:absolute;top:-5px;left:-5px;width:23px;height:23px;border-radius:50%;background:#f0e2c0;color:#1a1008;font-size:13px;font-weight:900;display:grid;place-items:center;box-shadow:0 2px 4px #000}
.gc .ab{position:absolute;bottom:3px;right:4px;font-size:12px}
.gc .rr{position:absolute;bottom:3px;left:4px;font-size:10px;opacity:.8}
.gc.sel{transform:translateY(-12px) scale(1.06);box-shadow:0 0 0 2px var(--gold2),0 0 16px #e8b85a}
.gc.hero{border-color:#ffd36b;background:linear-gradient(180deg,#5a4012,#2a1d08)}
.gc.hero .p{background:linear-gradient(180deg,#ffe3a0,#d9a443)}
.gc.sp{background:linear-gradient(180deg,#22304a,#121a2a);border-color:#4a7ab8}
.gw .bar{display:flex;gap:6px;padding:4px 10px 6px;align-items:center}
.gw .msg{flex:1;font-size:12.5px;color:var(--gold2);text-align:center;min-height:18px}
/* battle */
.bt{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 30%,#3a1414,#0d0709 70%);padding:calc(var(--sat) + 8px) 12px calc(var(--sab) + 10px)}
.hpbar{height:12px;border-radius:7px;background:#2a1418;overflow:hidden;border:1px solid #5c2a30}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff4d4d,#ff9a7a);transition:width .4s}
.hpbar.me i{background:linear-gradient(90deg,#3fbf6a,#9af0a0)}
.dmg{position:absolute;font-weight:900;font-size:28px;color:#ffdf9a;text-shadow:0 2px 0 #000,0 0 12px #ff6a2b;animation:dmg 1s forwards;pointer-events:none;z-index:5}
.dmg.crit{font-size:38px;color:#ffb733}
.dmg.heal{color:#7cf0a0}
@keyframes dmg{from{transform:translateY(0) scale(.6);opacity:0}20%{transform:translateY(-10px) scale(1.2);opacity:1}to{transform:translateY(-60px) scale(1);opacity:0}}
.blog{font-size:13px;color:#d8cfc0;min-height:40px;text-align:center;font-family:"Iowan Old Style",Georgia,serif;font-style:italic}
/* map */
.mapwrap{border-radius:16px;overflow:hidden;border:1px solid #4a3a26;box-shadow:0 8px 24px #000a;position:relative;background:#1a140c}
.mapwrap svg{display:block;width:100%;height:auto}
.mapnode{cursor:pointer}
.mapnode .pulse{animation:npulse 2s infinite;transform-origin:center;transform-box:fill-box}
@keyframes npulse{50%{opacity:.25;transform:scale(1.4)}}
/* misc */
.por-mini{width:56px;height:56px;border-radius:50%;overflow:hidden;flex:none;border:2px solid #6b5326;background:#0006}
.por-mini svg{width:100%;height:auto;margin-top:-4px;transform:scale(1.9);transform-origin:50% 32%}
.hearts{color:#ff6b8f;font-size:12px;letter-spacing:1px}
.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:8px;background:#0006;border:1px solid var(--line);color:var(--mut);margin-right:4px}
.tag.g{border-color:#7a5a2a;color:var(--gold2)}
.objs{margin:6px 0 2px;padding:0;list-style:none}
.objs li{font-size:13px;display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed #3a2f44}
.objs li.ok{color:#8fe39a}
.objs li.ok::before{content:"✓ "}
.empty{text-align:center;color:var(--mut);padding:24px 10px;font-style:italic}
.sep{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:10px 0}
.price{font-weight:800;color:var(--gold2);white-space:nowrap}
.up{color:#6fe08a}.dn{color:#ff6b6b}
.lvlup{text-align:center}
.lvlup .big{font-family:"Iowan Old Style",Georgia,serif;font-size:56px;font-weight:900;background:linear-gradient(180deg,#fff6d0,#e8b85a 60%,#9a6a1f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #e8b85a88)}
.title-screen{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#3a1a10 0%,#120a0c 60%,#07050a 100%);padding:20px;text-align:center}
.logo{font-family:"Iowan Old Style",Georgia,serif;font-size:44px;font-weight:900;letter-spacing:4px;line-height:1;background:linear-gradient(180deg,#fff2c8 0%,#ffb44a 45%,#c2410c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px #ff6a2b88)}

// ---------- inventory ----------
// elixirs: key "id#q"; ingredients/seeds/keys: id
function invAdd(k,n=1){S.inv[k]=(S.inv[k]||0)+n;if(S.inv[k]<=0)delete S.inv[k]}
function invHas(k,n=1){return (S.inv[k]||0)>=n}
function invCount(k){return S.inv[k]||0}
function elixCount(id,minQ=0){let c=0;for(let q=minQ;q<=4;q++)c+=S.inv[id+'#'+q]||0;return c}
function elixTake(id,n,minQ=0){ // take lowest qualities first that satisfy minQ
  for(let q=minQ;q<=4&&n>0;q++){const k=id+'#'+q;const h=S.inv[k]||0;const t=Math.min(h,n);if(t){invAdd(k,-t);n-=t}}return n===0}
function bestElix(id){for(let q=4;q>=0;q--)if(S.inv[id+'#'+q])return q;return -1}

const Save={cloud:null,busy:false,dirty:null,

  native(j){try{window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.save&&window.webkit.messageHandlers.save.postMessage(j)}catch(e){}},

  write(){if(!S)return;S.ts=Date.now();const j=JSON.stringify(S);try{localStorage.setItem(SAVE_KEY,j)}catch(e){}this.native(j);this.dirty=j;this.flush()},
  async flush(){if(!this.cloud||this.busy||!this.dirty)return;this.busy=true;await sleepMs(2000);const body=this.dirty;this.dirty=null;
    try{await this.cloud.set({j:body,ts:S.ts})}catch(e){}this.busy=false;if(this.dirty)this.flush()},
  async initCloud(){try{if(!(window.claude&&typeof window.claude.use==='function'))return null;
      const db=await window.claude.use('db');const user=await window.claude.use('user');if(!db||!user)return null;
      const id=await user.id();if(!id)return null;this.cloud=db.doc('data/users/'+id+'/save');
      const snap=await this.cloud.get();if(snap&&snap.exists){const d=snap.data();if(d&&d.j)return {st:JSON.parse(d.j),ts:d.ts||0}}
    }catch(e){}return null},
  exportCode(){return btoa(unescape(encodeURIComponent(JSON.stringify(S))))},
  importCode(c){const st=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));if(!st||!st.v||!st.inv)throw new Error('bad');return st}
};
function migrate(st){const base=newState(st.name);for(const k in base)if(st[k]===undefined)st[k]=base[k];

// ---------- audio ----------
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',v=.15,when=0,slide=0){const a=ac();if(!a)return;const t=a.currentTime+when;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,v=.2,when=0,hp=800){const a=ac();if(!a)return;const t=a.currentTime+when;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=a.createGain();g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start(t)}

const OV={stack:[],

const FX={on:true,init(){const c=$('#fx');const x=c.getContext('2d');let W,H,P=[];const rs=()=>{W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio};rs();addEventListener('resize',rs);
  for(let i=0;i<26;i++)P.push(this.mk(W,H,true));const loop=()=>{if(!document.hidden&&this.on){x.clearRect(0,0,W,H);for(const p of P){p.y-=p.v;p.x+=Math.sin(p.y/60+p.s)*.4;p.a-=.0015;if(p.y<-10||p.a<=0)Object.assign(p,this.mk(W,H));x.globalAlpha=Math.max(0,p.a);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}}requestAnimationFrame(loop)};loop()},
  mk(W,H,init){return{x:Math.random()*W,y:init?Math.random()*H:H+10,r:(Math.random()*1.6+.6)*devicePixelRatio,v:(Math.random()*.5+.2)*devicePixelRatio,a:Math.random()*.5+.2,s:Math.random()*6,c:Math.random()<.7?'#ff8a3d':'#ffd27a'}}};

// burst particles at element (DOM)
function burst(x,y,col='#ffd27a',n=24){for(let i=0;i<n;i++){const d=document.createElement('div');const a=Math.random()*Math.PI*2,s=60+Math.random()*120;
  d.style.cssText=`position:fixed;left:${x}px;top:${y}px;width:6px;height:6px;border-radius:50%;background:${col};box-shadow:0 0 8px ${col};z-index:95;pointer-events:none;transition:transform .9s cubic-bezier(.1,.8,.3,1),opacity .9s`;
  document.body.appendChild(d);requestAnimationFrame(()=>{d.style.transform=`translate(${Math.cos(a)*s}px,${Math.sin(a)*s}px) scale(.3)`;d.style.opacity='0'});setTimeout(()=>d.remove(),950)}}

   {t:'«Мне нужны деньги, а не флирт».',h:{liora:1},then:[L('liora','n','Скучно. Но честно. Ладно, деловой, работаем.')]},
  ]},
  L('liora','n','Рынок — это зверь. Каждый день цены другие. И если продать десять одинаковых зелий за раз — ты сам собьёшь себе цену. Следи за стрелками и слухами.'),
  L('liora','k','Заработай на продажах сто пятьдесят золотых — и я поверю, что ты не очередной бродяга с красивыми глазами.'),
  L('hero','k','Значит, глаза всё-таки красивые.'),
  L('liora','b','...Это была фигура речи. Иди работай.'),
 ]},
 q4e:{bg:'market',lines:[
  L('liora','s','Сто пятьдесят. Неплохо для новичка, которого месяц назад вытащили из стога.'),
  L('hero','o','Ты наводила обо мне справки?'),
  L('liora','k','Я всегда навожу справки. Это моя работа.'),
  L('liora','s','...Шучу. Наверное.'),
 ]},
 q5s:{bg:'dawn',lines:[
  N('Утро начинается с топота копыт. На площадь въезжают пятеро в цветах барона Гривса. Впереди — женщина в алом плаще, с мечом за спиной.'),
  L('aira','n','Жители Тихой Заводи! По приказу его милости барона Гривса деревня облагается особым сбором. Пятьсот золотых. До конца месяца.'),
  L('matvey','x','Пятьсот?! Да у нас на всю деревню столько в жизни не было!'),
  L('aira','n','Не мои проблемы, старик. Я наёмница. Мне платят — я передаю.'),
  L('hero','k','Передаёшь ты лихо. А думаешь сама — или это за отдельную плату?'),
  L('aira','a','...Это кто такой языкастый?'),
  L('hero','k','Местный алхимик. Скоро — самый известный в Валорне. Запиши, пока я раздаю автографы бесплатно.'),
  L('aira','a','Ха! Я из тех, кто клинком проверяет, сколько стоит человек. Но о деревенских мараться — себе дороже.'),
  L('aira','k','Пепельный Гамбит знаешь? Карточная игра. Обыграешь меня в таверне — лично передам барону, что Заводь платить не будет.'),
  L('hero','k','Карты, говоришь... Тогда раздавай. Только не плачь потом.'),
  N('Айра швыряет тебе потёртую колоду. «Чтобы честно», — бросает она.'),
 ]},
 q5e:{bg:'tavern',lines:[
  L('aira','o','...Как. Ты. Это. Сделал.'),
  L('hero','k','Секрет фирмы. Ты слишком рано выкладываешь сильные карты. Как и в жизни, наверное.'),
  L('aira','b','Не смей читать меня, как книгу!'),
  L('aira','n','...Слово есть слово. Я не вернусь к барону с деньгами. Но и не уеду. Тут что-то нечисто. У барона в погребе бочонков с монетой больше, чем у вас огурцов.'),
  L('aira','a','Ему нужно, чтобы деревня опустела. Зачем — не знаю. Но узнаю.'),
  {c:[
   {t:'«Оставайся. Мне пригодится меч, который умеет думать».',h:{aira:6},then:[L('aira','b','...Я остаюсь не из-за тебя! Просто контракт сорвался, а мне нужна крыша.')]},
   {t:'«Ты проиграла. Значит, теперь ты должна мне реванш».',h:{aira:4},then:[L('aira','k','Реванш? О, ты его получишь. И пожалеешь.')]},
  ]},
 ]},
 q6s:{bg:'dawn',lines:[
  L('matvey','x','Милок... колодец. Вода чёрная, пахнет тухлым. Трое уже слегли.'),
  L('aira','a','Барон. Его люди ночью у колодца шастали — стража проболталась. Решил выкурить деревню, раз денег не дали.'),
  L('hero','a','Он отравил колодец. Тот, из которого пьют дети.'),
  L('hero','n','Хорошо. Он хотел войны с алхимиком — он её получит. Но сначала — люди.'),
  N('Ты вспоминаешь урок: полынь вытягивает гниль, мята успокаивает чрево. Рецепт антидота встаёт перед глазами, будто учитель стоит за плечом.'),
 ]},
 q6e:{bg:'dawn',lines:[
  L('matvey','s','Отпустило! Всех отпустило!'),
  L('aira','s','А ты... ничего такой. Для языкастого.'),
  L('hero','k','Это был комплимент?'),
  L('aira','a','Это была констатация!'),
  N('Ночью у колодца находят обрывок плаща. Серая ткань. Вышитый знак — перо, перечёркнутое кинжалом.'),
  L('hero','a','...Серая ткань. Я видел такие плащи. В ту ночь.'),
 ]},
 q7s:{bg:'tavern',lines:[
  L('aira','n','Барон устраивает пир в честь именин. Будут все его прихвостни. Это шанс.'),
  L('hero','n','Шанс на что?'),
  L('aira','k','Войти через парадную дверь. Он обожает две вещи: выпивку и азартные игры. Особенно Гамбит.'),
  L('liora','k','А ещё его стража обожает настойку боярышника. Говорят, без неё они не стоят на ногах. Точнее — с ней не стоят.'),
  L('hero','k','Значит, я принесу подарок. Три бутылки лучшего «Боярышника» в Валорне. А потом обыграю барона в его же замке.'),
  L('liora','s','Обожаю мужчин с планом. Особенно когда в плане есть я.'),
  L('hero','n','Тебя в плане нет.'),
  L('liora','k','Пока.'),
 ]},
 baron_meet:{bg:'castle',lines:[
  L('baron','k','А, деревенский алхимик! Наслышан, наслышан. Говорят, ты испортил мне весь... хм... налоговый сезон.'),
  L('hero','k','Ваша милость, я принёс подарок. И предложение.'),
  L('baron','s','Подарок я возьму. А предложения мне делают только на коленях.'),
  L('hero','n','Партия в Гамбит. Если выигрываю — вы сжигаете долговые расписки Тихой Заводи и забываете к нам дорогу.'),
  L('baron','n','А если проигрываешь?'),
  L('hero','k','Тогда я буду варить вам «Боярышник» бесплатно. До конца жизни.'),
  L('baron','s','Ха-ха-ха! Вот это ставки! Садись, щенок!'),
 ]},
 q7e:{bg:'castle',lines:[
  L('baron','a','Не может быть... Ты жульничал! Стража! СТРАЖА!'),
  N('Стража не отвечает. Стража уже полчаса спит в обнимку с пустыми бутылками «Боярышника».'),
  L('hero','k','Ваша стража отдыхает, ваша милость. Хорошее было зелье. «Хорошее» — это, кстати, официальное качество.'),
  L('aira','k','Расписки. В камин. Живо.'),
  L('baron','x','Ладно-ладно! Я... я ведь не сам! Мне платили! Люди в серых мантиях! Велели найти мальчишку с медальоном, а деревню... выжечь, чтоб не болтала!'),
  {fx:'flash'},N('Медальон на твоей груди вспыхивает жаром. Барон бледнеет, глядя на него.'),
  L('baron','x','...Мальчишку... с медальоном...'),
  L('hero','a','Передай своим серым друзьям, барон. Мальчишка вырос. И когда он придёт за ними — пусть не просят пощады. Пепел не умеет прощать.'),
  N('Долговые расписки горят в камине. Красиво горят.'),
 ]},
 q8s:{bg:'dawn',lines:[
  L('matvey','x','Охотники из Рощи вернулись бледные. Говорят, деревья там... гниют изнутри. Чернеют. И зверьё ушло.'),
  L('hero','n','Гниль не приходит сама. Её кто-то приносит.'),
 ]},
 q8e:{bg:'forest',lines:[
  N('Посреди почерневшей поляны тебя встречает наконечник стрелы. Прямо у горла.'),
  L('seylin','n','Ещё шаг — и твоя кровь удобрит этот лес. Ему как раз не хватает чего-то живого.'),
  L('hero','k','Обычно девушки начинают знакомство с «привет».'),
  L('seylin','a','Обычно люди не пахнут жжёной алхимией. Ты пахнешь. Это ты отравил Рощу?'),
  L('hero','n','Если бы я травил леса, здесь не осталось бы ни одного дерева. Я лечу. Деревню, людей. А теперь, похоже, и твою Рощу.'),
  L('seylin','o','...'),
  N('Она медленно опускает лук. Будто прислушивается к чему-то, чего ты не слышишь.'),
  L('seylin','s','Деревья говорят, ты не врёшь. Странно. Люди обычно врут даже деревьям.'),
  L('seylin','n','Я — Сэйлин, страж Эльвенара. Меня послали узнать, почему умирает лес на границе. Эта гниль — не болезнь. Это проклятие. Алхимическое.'),
  L('hero','k','Тогда ему нужен алхимик.'),
  L('seylin','s','Самоуверенный алхимик. Мой народ таких называет... впрочем, неважно.'),
  {c:[
   {t:'«Мне не нужна благодарность леса. Мне нужна твоя».',h:{seylin:6},then:[L('seylin','b','Ты... очень прямолинеен для человека.')]},
   {t:'«Я не люблю, когда умирает то, что можно спасти».',h:{seylin:4},then:[L('seylin','s','Хорошие слова. Посмотрим, хорош ли тот, кто их говорит.')]},
  ]},
 ]},
 q9s:{bg:'forest',lines:[
  L('seylin','n','Чтобы очистить Рощу, нужен Сердцецвет. Он растёт только там, где о нём заботятся с любовью. Я научу тебя.'),
  N('Сэйлин протягивает тонкую книжицу в обложке из живого листа. Обложка тёплая.'),
  L('seylin','s','Не урони её. Она обидчивая.'),
 ]},
 q9e:{bg:'home',lines:[
  L('seylin','s','Они расцвели. Для человека у тебя удивительно нежные руки.'),
  L('hero','k','Ты ещё не видела, как я варю.'),
  L('seylin','b','...Я не это имела в виду.'),
 ]},
 q10e:{bg:'forest',lines:[
  N('Эликсир падает на чёрную землю — и земля кричит. Не звуком — светом. Гниль сворачивается, как обожжённый лист, и на месте её сердца проступает знак.'),
  {fx:'flash'},N('Чёрное солнце в круге из алхимических символов.'),
  L('seylin','x','Знак Пепельного Культа... Его не видели триста лет.'),
  L('hero','n','Посмотри внимательно. Символы по краю — не руны Культа. Это нотация Конклава. Так пишут алхимики Тигля.'),
  L('seylin','o','Конклав... и Культ? Невозможно. Конклав снабжает эликсирами армии, что воюют с Тьмой!'),
  L('hero','a','Очень удобно. И продавать лекарство, и разносить болезнь.'),
  L('seylin','n','Есть та, кто сможет прочесть этот знак до конца. Но она... опасна. Ведьма с Гнилого Болота.'),
  L('hero','k','Опасные женщины — моя специальность. Как выяснилось.'),
  L('seylin','a','Ты невыносим.'),
  L('seylin','b','...И, кажется, ты мне нравишься. Не придавай этому значения.'),
  L('seylin','n','Тропа к ведьме видна только ночью. Тебе понадобится зелье ночного зрения — я покажу рецепт.'),
 ]},
 q11s:{bg:'forest',lines:[
  L('seylin','n','Пыльцу светляков ищи в Роще, лунную росу — на лилиях. А мухоморы... ну, мухоморы найдут тебя сами.'),
  L('hero','k','Звучит как начало очень плохой ночи.'),
  L('seylin','s','Или очень хорошей. Ведьмы непредсказуемы.'),
 ]},
 q11e:{bg:'swamp',lines:[
  N('Огни ведут тебя вглубь трясины. Туман густеет, пока не становится почти осязаемым. Посреди топи — изба на сваях. Из трубы — зелёный дым.'),
  L('velena','k','Явился, огненный. Я тебя три дня назад во сне видела.'),
  L('hero','k','Надеюсь, сон был приятный?'),
  L('velena','s','Ты в нём горел. Весь. Красиво горел — я даже проснулась.'),
  L('velena','n','Велена я. Кто ведьмой кличет, кто — Болотной, а кто и вовсе не кличет: боится.'),
  L('hero','n','Я пришёл не бояться. Мне нужно прочесть знак.'),
  L('velena','k','Знаю, что тебе нужно. Мне сороки всё рассказывают. Только ведьмы, огненный, задаром ничего не делают.'),
  L('velena','n','Принеси мне то, чего нет в природе. Траву, что выросла не такой, какой должна была. Мутанта, по-вашему, по-учёному.'),
  L('hero','k','«Чего тебе надобно, старче?» ...То есть — сударыня.'),
  L('velena','s','Ха! Сказки знаешь. Это хорошо. В сказках вся правда и лежит — только задом наперёд.'),
 ]},
 q12e:{bg:'swamp',lines:[
  L('velena','o','Ох ты ж... Живое. Красивое. Не обманул.'),
  N('Велена льёт на угли зелёное масло и бросает щепоть пепла. Дым складывается в чёрное солнце.'),
  L('velena','x','Это не просто знак. Это подпись. Кто-то из Семи Магистров кормит Тьму. Давно кормит. Через ваши алхимические эликсиры...'),
  L('velena','n','А ещё, огненный... на тебе метка. Старая, сильная. Тебя ищут. И не только люди.'),
  {fx:'shake'},N('Медальон раскаляется так, что ты вскрикиваешь. Цепочка рвётся, медальон падает на пол — и раскрывается.'),
  {fx:'flash'},
  L('medal','n','...{name}.'),
  L('hero','o','...Учитель?!'),
  L('medal','s','Не кричи. Я — всего лишь эхо. Осколок, который я успел вложить в пепел. Надолго меня не хватит.'),
  L('medal','n','Ты нашёл знак. Значит, ты на верном пути. И значит — ты в опасности.'),
  L('hero','a','Кто предал вас? Скажите имя!'),
  L('medal','d','Ты всё ещё слишком слаб, чтобы его услышать. Стань сильнее. Стань лучшим. Тогда пепел сам назовёт тебе имя.'),
  L('medal','k','И ещё, {name}... ты правда собирался питаться одними ромашками? Я учил тебя лучше.'),
  L('hero','s','...Вы даже мёртвый ворчите.'),
  L('medal','s','Я не мёртвый. Я в другом агрегатном состоянии.'),
  N('Свет гаснет. Медальон снова холодный. Но теперь ты знаешь: ты не один.'),
  L('velena','s','Вот оно что... Ученик Феникса. Ох, огненный, с тобой будет весело.'),
  L('velena','k','Держи. Гримуар моей прабабки. Там рецепты, за которые инквизиция сжигает. Тебе понравится.'),
 ]},
 q13s:{bg:'dawn',lines:[
  N('В Заводь въезжают всадники в серых плащах. Серебряные полумаски. Знак пера, перечёркнутого кинжалом.'),
  L('kael','n','Инквизиция Конклава. Я — Каэль, Длань Тигля. Мы ищем беглого еретика. Юношу. Серебряные волосы. Медальон.'),
  L('matvey','x','Нету таких, ваше... серое благородие. У нас одни старики да козы.'),
  L('kael','k','Козы не варят зелья, старик. А в этой деревне кто-то варит. И очень неплохо.'),
  N('Ты стоишь в толпе, натянув капюшон. Внезапно рядом возникает Лиора.'),
  L('liora','k','Брат Каэль! Какая встреча. Помните меня? Мирана, ярмарка пряностей. Вы тогда ещё были младшим дознавателем.'),
  L('kael','o','...Вэнс. Что ты делаешь в этой дыре?'),
  L('liora','s','Торгую, как всегда. А алхимик здесь — старая карга с болота. Все знают. Езжайте к ней — если пиявок не боитесь.'),
  N('Каэль смотрит на Лиору долго. Слишком долго. Потом разворачивает коня.'),
  L('kael','n','Мы проверим. И вернёмся, Вэнс.'),
  L('hero','n','...Откуда ты знаешь инквизитора по имени? И его прежнее звание?'),
  L('liora','s','Милый, я знаю имена всех, кому продавала перец. А перец любят все. Даже инквизиторы.'),
  L('liora','k','Не смотри на меня так. Я только что спасла тебе жизнь. Мог бы и поцеловать. В щёчку.'),
  {c:[
   {t:'Поцеловать. В щёчку.',h:{liora:8},then:[L('liora','b','...Ты правда это сделал. Ох. Ладно. Ладно.')]},
   {t:'«Спасибо. Но я тебе не верю».',h:{liora:3},then:[L('liora','d','Правильно. Никому не верь. Даже мне. Особенно мне.')]},
  ]},
  L('aira','a','Они вернутся. И не втроём, а с отрядом. Нам нужно оружие.'),
  L('hero','k','У алхимика всегда есть оружие. Сера, мухомор, огненный пепел... Я устрою им такой вечер, что Конклав будет пугать им новобранцев.'),
  N('Рецепты сами всплывают в памяти — уроки Мастера, которые ты когда-то проспал.'),
 ]},
 q14s:{bg:'night',lines:[
  N('Ночь. Они приходят без факелов — двадцать серых теней. Впереди — Каэль.'),
  L('kael','n','Ведьма оказалась не той, кого мы искали. А вот ты — тот. Отдай медальон, мальчик, и я обещаю тебе быструю смерть.'),
  L('hero','k','Какое щедрое предложение. А я думал, инквизиторы скупые.'),
  L('kael','k','Твой учитель тоже шутил. До последнего. Знаешь, как кричит горящий Феникс?'),
  L('hero','a','...Знаю. Я слышу этот крик каждую ночь.'),
  L('hero','a','И сегодня я наконец на него отвечу.'),
  L('aira','k','Тени справа — мои.'),
  L('seylin','n','Тени слева — мои.'),
  L('velena','k','А мне, чур, главного. Шучу. Главный — твой, огненный.'),
 ]},
 q14e:{bg:'night',lines:[
  N('Каэль падает на колено. Серебряная маска треснула пополам.'),
  L('kael','x','Ты... не просто ученик. В тебе его огонь... Он отдал тебе... Не может быть...'),

function luck(){let l=T('fortune')*.04+(hasBook('b_fortune')?.06:0)+(hasRelic('ring')?.10:0)+(hp('velena',30)?.05:0)+(S.flags.fern?.08:0)+(S.buffs.luck||0)+(S.weather==='звездопад'?.10:0);return l}
function sellBonus(){return 1+T('tongue')*.05+(hasBook('b_trade')?.10:0)+(hasRelic('monocle')?.10:0)+(hp('liora',60)?.10:0)+(S.buffs.charm?.20:0)}
function buyMult(){return Math.max(.5,1-T('haggle')*.05-(hp('liora',30)?.10:0))}
function mutChance(){return .06+T('mutagen')*.015+(hasBook('b_mutation')?.04:0)+(hp('seylin',60)?.03:0)+luck()*.04}
function xpMult(){return 1+(hasBook('b_preis')?.10:0)}
function maxEnergy(){return 30+(S.level-1)*2+T('stamina')*4+(hasRelic('cloth')?10:0)}
function xpNeed(l){return Math.round(50*Math.pow(l,1.5))}
function lwt(r,w){return r>=2?w*Math.pow(1+luck(),r-1):w}

let pendingLevelUps=[];
function gainXP(n){n=Math.round(n*xpMult());S.xp+=n;while(S.xp>=xpNeed(S.level)){S.xp-=xpNeed(S.level);S.level++;S.tp++;onLevel(S.level);pendingLevelUps.push(S.level)}}
function onLevel(l){S.maxEnergy=maxEnergy();S.energy=Math.min(S.maxEnergy,S.energy+10);
  if(l===3||l===6)S.plotMax+=2;if(l===10)S.plotMax+=4;if(l===6||l===12)S.relicSlots++;while(S.plots.length<S.plotMax)S.plots.push(null);
  if(l%3===0)invAdd('token',1);if(l===2&&!S.orders.length)genOrders();if(l===10)ach('lvl10')}
function gold(n){S.gold+=n;if(n>0)sfx('coin')}
function useEnergy(n){if(S.energy<n){toast('Не хватает энергии ⚡ — выпей Отвар Бодрости или ляг спать','bad');return false}S.energy-=n;return true}
function ach(id){if(S.ach[id])return;S.ach[id]=1;const a=ACH[id];S.gold+=a.g;toast(`🏆 Достижение: <b>${a.n}</b> (+${a.g}💰)`,'gold');sfx('rare');hap('success')}
function itemName(k){const [id,q]=k.split('#');if(q!==undefined)return RECIPES[id].n;return (ITEMS[id]||{}).n||id}
function itemEmoji(k){const [id,q]=k.split('#');if(q!==undefined)return RECIPES[id].e;const it=ITEMS[id];return it?(it.seedE?it.seedE:it.e):'❔'}
function itemRar(k){const [id,q]=k.split('#');if(q!==undefined)return +q;return (ITEMS[id]||{}).r||0}

// ---------- rewards ----------
function giveReward(rew,silent){const out=[];if(!rew)return out;
  if(rew.gold){gold(rew.gold);out.push({e:'💰',n:'Золото',c:rew.gold,r:1})}
  if(rew.xp){gainXP(rew.xp);out.push({e:'✨',n:'Опыт',c:rew.xp,r:1})}
  for(const k in rew.items||{}){invAdd(k,rew.items[k]);out.push({e:itemEmoji(k),n:itemName(k),c:rew.items[k],r:itemRar(k)})}
  for(const k in rew.chests||{}){S.chests[k]=(S.chests[k]||0)+rew.chests[k];out.push({e:'📦',n:CHESTS[k].n,c:rew.chests[k],r:k==='wood'?0:k==='iron'?1:k==='gold'?2:k==='myth'?3:4})}
  for(const b of rew.books||[]){if(learnBook(b,true))out.push({e:BOOKS[b].e,n:BOOKS[b].n,r:BOOKS[b].r})}
  for(const r of rew.recipes||[]){if(!S.recipes.includes(r)){S.recipes.push(r);out.push({e:RECIPES[r].e,n:'Рецепт: '+RECIPES[r].n,r:2})}}
  for(const c of rew.cards||[]){S.cards[c]=(S.cards[c]||0)+1;out.push({e:CARDS[c].e,n:'Карта: '+CARDS[c].n,r:CARDS[c].r})}
  for(const g in rew.hearts||{}){heart(g,rew.hearts[g],true);out.push({e:'💗',n:CHARS[g].n,c:rew.hearts[g],r:3})}
  for(const f of rew.flags||[])S.flags[f]=1;
  if(rew.diary){if(addDiary(rew.diary))out.push({e:'📜',n:'Дневник Мастера, стр. '+rew.diary,r:4})}
  return out}
function learnBook(id,silent){if(S.books.includes(id))return false;S.books.push(id);const b=BOOKS[id];for(const r of b.rec||[])if(!S.recipes.includes(r))S.recipes.push(r);
  if(b.set==='war'&&['b_war1','b_war2','b_war3','b_war4'].every(hasBook)){if(!S.recipes.includes('peace'))S.recipes.push('peace');S.tp++;ach('war');toast('📚 Собрание «Войны и Мира Зелий» полное! Рецепт + очко таланта','leg')}
  if(id==='b_carto')toast('🗺️ На карте появился Курган Безымянных','gold');
  if(!silent)toast(`📖 Книга: <b>${b.n}</b>`,'gold');return true}
function addDiary(n){S.flags.diary=S.flags.diary||[];if(S.flags.diary.includes(n))return false;S.flags.diary.push(n);if(S.flags.diary.length>=7){if(!S.recipes.includes('phoenix'))S.recipes.push('phoenix');ach('diary')}return true}

// ---------- farming ----------
function plant(i,seed){const p=S.plots[i];if(p||!invHas(seed))return;invAdd(seed,-1);S.plots[i]={s:seed,d:0,w:S.weather==='дождь'};Bus.emit('plant');sfx('click');hap()}
function water(i){const p=S.plots[i];if(!p||p.w)return false;p.w=true;return true}
function waterAll(){const need=S.plots.filter(p=>p&&!p.w&&p.d<CROPS[p.s].d).length;if(!need){toast('Всё уже полито 💧');return}if(!useEnergy(1))return;S.plots.forEach(p=>{if(p)p.w=true});sfx('brew');toast(`💧 Полито грядок: ${need}`)}
function plotReady(p){return p&&p.d>=CROPS[p.s].d}
function harvest(i){const p=S.plots[i];if(!plotReady(p))return null;const c=CROPS[p.s];let n=ri(c.y[0],c.y[1]);if(chance(T('green')*.15))n++;if(c.prod==='chamomile'&&hasBook('b_margo'))n++;
  let mc=mutChance()*(c.mutK||1);if(S.weather==='гроза')mc*=2;if(p.zap)mc=1;const mut=chance(mc);
  if(mut){invAdd(c.mut,1);n=Math.max(0,n-1);S.stats.mut++;ach('mut')}
  invAdd(c.prod,n);S.plots[i]=null;S.stats.harvest+=n+(mut?1:0);Bus.emit('harvest',{id:c.prod,n:n+(mut?1:0)});gainXP(2*(n+1)+(mut?20:0));
  return {prod:c.prod,n,mut:mut?c.mut:null}}

// ---------- brewing ----------
function missing(rid){const r=RECIPES[rid];const m=[];for(const k in r.ing){const h=invCount(k);if(h<r.ing[k])m.push([k,r.ing[k]-h])}return m}
function brewYield(){return CAULDRON[S.cauldron].y}
function brewRoll(rid,zone){ // zone: -1 fail,0 ok,1 good,2 perfect
  const r=RECIPES[rid];
  for(const k in r.ing){for(let j=0;j<r.ing[k];j++){if(!chance(T('thrift')*.08))invAdd(k,-1)}}
  S.stats.brewed++;
  if(zone<0&&chance(.4)){S.stats.boom++;ach('boom');Bus.emit('brewfail');return {boom:true}}
  const ins=T('insight')*.04+S.level*.004+(S.cauldron-1)*.025+luck()*.15;const zb=[-.4,0,.12,.3][zone+1];
  let q=0;const p=[.40+zb+ins,.22+zb*.8+ins,.08+zb*.5+ins*.7,.06+zb*.2+ins*.4+(hasRelic('mirror')?.03:0)];
  if(zone===2)q=1;
  for(let i=q;i<4;i++){if(chance(clamp(p[i],0,.95)))q=i+1;else break}
  if(zone<0)q=0;
  let cnt=brewYield();const crit=chance(.08+T('double')*.05);if(crit){cnt*=2;S.stats.crit++}
  invAdd(rid+'#'+q,cnt);
  gainXP(r.xp*cnt*(1+q*.35));
  if(q>=3){S.stats.mastery++;ach('master')}if(q>=4){ach('legbrew');S.stats.legend++}
  if(S.stats.brewed===1)ach('first');
  Bus.emit('brew',{id:rid,q,n:cnt});
  return {q,cnt,crit}}

function rollBag(){const r=wpick([0,1,2,3,4,5].map(r=>[r,[0,40,34,18,6.5,1.2][r]]),x=>lwt(x[0],x[1]))[0];const it=rollItemOfRarity(r);applyLoot([it]);return it}

// ---------- loot ----------
function poolByR(r){return Object.keys(ITEMS).filter(k=>{const it=ITEMS[k];return it.r===r&&it.t!=='key'&&k!=='koschei_needle'||(r===5&&k==='koschei_needle')}).filter(k=>ITEMS[k].t!=='key')}
function rollItemOfRarity(r,ctx={}){
  const books=Object.keys(BOOKS).filter(b=>!hasBook(b)&&!['b_basics','b_green','b_grimoire','b_trade'].includes(b));
  const relics=Object.keys(RELICS).filter(x=>!S.relics.includes(x));
  const cards=Object.keys(CARDS).filter(c=>!CARDS[c].npc);
  const opts=[];
  const ing=poolByR(r).filter(k=>ITEMS[k].t!=='seed'||r<=1);
  if(r<=1){opts.push(['ing',70],['seed',20]);if(S.recipes.length)opts.push(['elix',10])}
  if(r===2){opts.push(['ing',55],['key_gold',7],['token',8],['pack',9],['card',10]);if(books.some(b=>BOOKS[b].r<=2))opts.push(['book',7]);opts.push(['elix',6])}
  if(r===3){opts.push(['ing',45],['card',16],['elix',14],['pack',8]);if(books.some(b=>BOOKS[b].r===3))opts.push(['book',14]);if(S.flags.medal_awake&&(S.flags.diary||[]).length<7)opts.push(['diary',6])}
  if(r===4){opts.push(['ing',32],['card',16],['key_myth',10]);if(relics.some(x=>RELICS[x].r===4))opts.push(['relic',34]);if(books.some(b=>BOOKS[b].r===4))opts.push(['book',10])}
  if(r===5){opts.push(['ing',45],['card',10]);if(relics.some(x=>RELICS[x].r===5))opts.push(['relic',45])}
  const kind=wpick(opts,x=>x[1])[0];
  if(kind==='ing'){const k=pick(ing.length?ing:poolByR(0));return{kind:'item',id:k,n:r===0?ri(1,3):1,r}}
  if(kind==='seed'){const s=pick(Object.keys(CROPS).filter(s=>!CROPS[s].req||hasBook(CROPS[s].req)));return{kind:'item',id:s,n:ri(1,3),r:ITEMS[s].r}}
  if(kind==='elix'){const rid=pick(S.recipes.length?S.recipes:['bodr']);const q=clamp(r+(chance(.3)?1:0)-1,0,4);return{kind:'item',id:rid+'#'+q,n:1,r:q}}
  if(['key_gold','token','pack','key_myth'].includes(kind))return{kind:'item',id:kind,n:1,r:ITEMS[kind].r};
  if(kind==='card'){const pool=cards.filter(c=>CARDS[c].r===r);const c=pick(pool.length?pool:cards.filter(c=>CARDS[c].r<=r));return{kind:'card',id:c,n:1,r:CARDS[c].r}}
  if(kind==='book'){const pool=books.filter(b=>BOOKS[b].r===r||(r===2&&BOOKS[b].r<2));const b=pick(pool);return{kind:'book',id:b,n:1,r:BOOKS[b].r}}
  if(kind==='relic'){const pool=relics.filter(x=>RELICS[x].r===r);const x=pick(pool);return{kind:'relic',id:x,n:1,r}}
  if(kind==='diary'){const left=[4,5,6,7].filter(n=>!(S.flags.diary||[]).includes(n));if(left.length)return{kind:'diary',id:left[0],n:1,r:4};return{kind:'item',id:pick(poolByR(3)),n:1,r:3}}
  return{kind:'item',id:'chamomile',n:1,r:0}}
function rollChest(type){const c=CHESTS[type];const rolls=ri(c.rolls[0],c.rolls[1])+(chance(T('eye')*.08)?1:0);const out=[];let maxR=0;
  for(let i=0;i<rolls;i++){let r=wpick([0,1,2,3,4,5].map(r=>[r,c.w[r]]),x=>lwt(x[0],x[1]))[0];
    if(type!=='wood'&&type!=='iron'){S.pity.rolls++;if(r>=4)S.pity.rolls=0;if(S.pity.rolls>=60){r=4;S.pity.rolls=0}}
    const it=rollItemOfRarity(r);out.push(it);maxR=Math.max(maxR,it.r)}
  const g=ri(c.g[0],c.g[1]);out.unshift({kind:'gold',n:g,r:0});return{items:out,maxR}}
function applyLoot(items){for(const it of items){
  if(it.kind==='gold')gold(it.n);
  else if(it.kind==='item')invAdd(it.id,it.n);

function shells(){S.gold-=50;if(chance(.34+luck()*.2)){gold(150);return{msg:'Шарик под твоим напёрстком! +150💰. Ходжа уважительно цокает языком.'}}return{msg:'Пусто. «Аллах любит терпеливых», — Ходжа прячет твои 50💰.'}}
function pickEvent(loc,night){let pool=EXP_EVENTS.filter(e=>(!e.locs||e.locs.includes(loc))&&(!e.night||night||e.id==='wolves'&&loc==='lair'));
  if(pool.some(e=>e.danger)){const safe=S.buffs.safe||(hp('aira',60)&&chance(.5))||(hasRelic('hat')&&chance(.5));if(safe)pool=pool.filter(e=>!e.danger)}return pool.length?pick(pool):null}

// ---------- day ----------
function newDay(){const rep={};
  for(const p of S.plots){if(!p)continue;if(p.w){p.d++;if(hp('seylin',30)&&chance(.25))p.d++}p.w=false;p.zap=false}
  S.day++;S.buffs={};S.maxEnergy=maxEnergy();S.energy=S.maxEnergy;
  S.weather=wpick([['ясно',58],['дождь',20],['гроза',7],['туман',9],['звездопад',6]],x=>x[1])[0];
  if(S.weather==='дождь'||S.weather==='гроза')S.plots.forEach(p=>{if(p)p.w=true});
  if(S.weather==='гроза'){const gr=S.plots.filter(p=>p);if(gr.length&&chance(.25)){const p=pick(gr);p.zap=true;rep.zap=CROPS[p.s].n}}
  updateMarket();
  if(chance(.38)){const r=wpick([[0,60],[1,30],[2,8],[3,1.6],[4,.25]],x=>lwt(x[0],x[1]))[0];const it=rollItemOfRarity(r);if(it.kind==='relic'||it.kind==='book'||it.kind==='diary'){it.kind='item';it.id=pick(poolByR(Math.min(r,3)))}S.cat=it}
  if(hasRelic('hen')){if(chance(.15)){gold(250);rep.egg='золотое'}else{rep.egg='обычное'}}
  if(S.level>=2&&(S.day-S.ordersDay>=3||S.orders.length===0))genOrders();
  if(hp('velena',50)){const ev=pick(MEVENTS);S.flags.forecast=ev.id;rep.forecast=ev.t}
  rep.ready=S.plots.filter(plotReady).length;
  Save.write();return rep}

// ---------- orders ----------
function genOrders(){S.ordersDay=S.day;S.orders=[];const rs=S.recipes.filter(r=>!['phoenix','living','dead','peace'].includes(r));if(!rs.length)return;
  for(let i=0;i<3;i++){const rid=pick(rs);const n=ri(1,RECIPES[rid].p>200?2:4);const q=S.level>=8&&chance(.35)?2:S.level>=4&&chance(.45)?1:0;
   const girls=Object.keys(GIRL_REQ).filter(g=>qDone(GIRL_REQ[g])||S.quests[GIRL_REQ[g]]&&g!=='velena');const girl=chance(.25)&&girls.length?pick(girls):null;
   const g=Math.round(RECIPES[rid].p*QMULT[q]*n*(1.5+rnd()*.5)*(1+T('conn')*.1));
   S.orders.push({id:Date.now()+i,npc:girl?CHARS[girl].n:pick(ORDER_NPC),girl,rid,n,q,gold:g,xp:Math.round(RECIPES[rid].xp*n*1.5),chest:chance(.3)?(chance(.15)?'gold':chance(.4)?'iron':'wood'):null})}}
function fulfillOrder(o){if(elixCount(o.rid,o.q)<o.n)return false;elixTake(o.rid,o.n,o.q);gold(o.gold);gainXP(o.xp);if(o.chest)S.chests[o.chest]=(S.chests[o.chest]||0)+1;if(o.girl)heart(o.girl,3);S.orders=S.orders.filter(x=>x!==o);return true}

// ---------- romance ----------
function heart(g,n,silent){const m=(1+T('charisma')*.25)*(S.buffs.charm?2:1);const v=Math.round(n>0?n*m:n);S.hearts[g]=clamp(S.hearts[g]+v,0,100);if(!silent&&v>0){toast(`💗 ${CHARS[g].n} +${v}`);sfx('heart')}
  if(S.hearts[g]>=80)ach('heart');if(Object.values(S.hearts).every(h=>h>=50))ach('harem')}
function giftValue(g,k){const id=k.split('#')[0];const G=GIFTS[g];if(G.love.includes(id))return 8;if(G.like.includes(id))return 4;if(G.hate.includes(id))return -3;return 1}
function nextRomance(g){const ev=ROMANCE[g];const done=S.hev[g]||0;const e=ev[done];if(e&&S.hearts[g]>=e.at)return e;return null}

// ---------- quests ----------
function startQuest(id){if(S.quests[id])return;const q=QMAP[id];S.quests[id]={st:'a',c:q.objs.map(()=>0),b:{earned:S.stats.earned}};
  const on=q.on||{};for(const k in on.items||{})invAdd(k,on.items[k]);for(const b of on.books||[])learnBook(b,true);for(const r of on.recipes||[])if(!S.recipes.includes(r))S.recipes.push(r);for(const f of on.flags||[])S.flags[f]=1;
  if(on.deck&&!S.deck.length){for(const c of STARTER_DECK)S.cards[c]=(S.cards[c]||0)+1;S.deck=STARTER_DECK.slice()}genShop()}
function objProg(q,i){const o=q.objs[i];const st=S.quests[q.id];let cur=0,need=o.n||1;
  switch(o.t){case'plant':case'harvest':case'brew':case'explore':case'card':case'fight':cur=st.c[i];break;
   case'give':cur=RECIPES[o.id]?elixCount(o.id,o.q||0):invCount(o.id);break;
   case'givemut':cur=Object.keys(S.inv).filter(k=>ITEMS[k]&&ITEMS[k].t==='mut').reduce((a,k)=>a+S.inv[k],0);break;
   case'giveq':cur=Object.keys(S.inv).filter(k=>k.includes('#')&&+k.split('#')[1]>=o.q).reduce((a,k)=>a+S.inv[k],0);need=1;break;
   case'earn':cur=S.stats.earned-(st.b.earned||0);break;case'lvl':cur=S.level;break;case'pay':cur=S.gold;break}
  return [Math.min(cur,need),need]}
function questReady(id){const q=QMAP[id];const st=S.quests[id];if(!st||st.st!=='a')return false;return q.objs.every((o,i)=>{const [c,n]=objProg(q,i);return c>=n})}
function turnIn(id){const q=QMAP[id];if(!questReady(id))return null;
  q.objs.forEach(o=>{if(o.t==='give'){if(RECIPES[o.id])elixTake(o.id,o.n,o.q||0);else invAdd(o.id,-o.n)}
   if(o.t==='givemut'){const k=Object.keys(S.inv).find(k=>ITEMS[k]&&ITEMS[k].t==='mut');invAdd(k,-1)}
   if(o.t==='giveq'){const ks=Object.keys(S.inv).filter(k=>k.includes('#')&&+k.split('#')[1]>=o.q).sort((a,b)=>RECIPES[a.split('#')[0]].p-RECIPES[b.split('#')[0]].p);invAdd(ks[0],-1)}
   if(o.t==='pay')S.gold-=o.n});
  S.quests[id].st='d';const out=giveReward(q.rew,true);return out}
function currentMain(){for(const q of QUESTS){const st=S.quests[q.id];if(!st)return null;if(st.st==='a')return q}return null}
function nextMainId(){for(const q of QUESTS)if(!S.quests[q.id])return q.id;return null}
Bus.on('plant',()=>bump('plant'));Bus.on('harvest',d=>bump('harvest',o=>!o.id||o.id===d.id,d.n));
Bus.on('brew',d=>bump('brew',o=>o.id===d.id&&d.q>=(o.q||0),1));Bus.on('explore',loc=>bump('explore',o=>o.loc===loc));
Bus.on('cardwin',opp=>bump('card',o=>o.opp===opp));Bus.on('fightwin',foe=>bump('fight',o=>o.foe===foe));
function bump(t,f=()=>true,n=1){for(const q of QUESTS){const st=S.quests[q.id];if(!st||st.st!=='a')continue;q.objs.forEach((o,i)=>{if(o.t===t&&f(o))st.c[i]+=n})}}

// ====== BATTLE ======
function startBattle(foeId,onEnd){const F=FOES[foeId];const pm=80+S.level*6;
  const B={foe:F,id:foeId,ehp:F.hp,emax:F.hp,php:pm,pmax:pm,might:0,stone:0,dodge:0,smoke:0,stun:0,hex:0,used:{},turn:0,busy:false,log:'Схватка начинается!'};
  const m=OV.open(`<div class="bt" id="bt"></div>`,{full:true});
  const allies=[];if(hp('aira',30)||F.story)allies.push({g:'aira',n:'Алый Взмах',d:'30–40 урона'});if((hp('seylin',30)||F.story)&&S.flags.seylin_met)allies.push({g:'seylin',n:'Шквал стрел',d:'3 × 10–14'});
  if((hp('velena',30)||F.story)&&S.flags.velena_met)allies.push({g:'velena',n:'Сглаз',d:'Враг слабее на 40%'});if(hp('liora',30))allies.push({g:'liora',n:'Золотой порошок',d:'Враг пропускает 2 хода'});
  const dmgMult=()=>(1+T('phoenix')*.12)*(B.might?1.6:1);
  function pop(txt,cls,who){const el=document.createElement('div');el.className='dmg '+(cls||'');el.textContent=txt;const tgt=$(who==='e'?'#bt-e':'#bt-p',m);if(!tgt)return;const r=tgt.getBoundingClientRect();el.style.left=(r.left+r.width/2-30+ri(-20,20))+'px';el.style.top=(r.top+r.height*.3)+'px';el.style.position='fixed';document.body.appendChild(el);setTimeout(()=>el.remove(),1000)}
  function render(){const acts=[];acts.push(`<button class="btn" data-a="hit">⚔️ Удар</button>`);
    for(const rid in RECIPES){const r=RECIPES[rid];if(!r.bat)continue;const c=elixCount(rid);if(c)acts.push(`<button class="btn sec" data-a="e:${rid}">${r.e} ${r.n.split(' ').slice(0,2).join(' ')} <span class="mut">×${c}</span></button>`)}
    for(const a of allies)if(!B.used[a.g])acts.push(`<button class="btn sec" data-a="g:${a.g}" style="border-color:${CHARS[a.g].col}">💗 ${CHARS[a.g].n}: ${a.n}</button>`);
    if(!F.story)acts.push(`<button class="btn sec" data-a="run">🏃 Бежать</button>`);
    $('#bt',m).innerHTML=`<div style="text-align:center"><div class="serif" style="font-size:20px;color:#ffb0a0">${F.n}</div><div class="hpbar" style="margin:6px 20px"><i style="width:${B.ehp/B.emax*100}%"></i></div><div class="mut">${Math.max(0,B.ehp)} / ${B.emax} ${B.stun?'· 💫 оглушён':''}${B.hex?' · 🌙 сглаз':''}${B.smoke?' · 💨 ослеплён':''}</div></div>
    <div id="bt-e" style="flex:1;display:flex;align-items:center;justify-content:center;min-height:0">${F.por?`<div style="width:min(70vw,260px)">${portrait(F.por,B.ehp<B.emax*.3?'x':'a')}</div>`:`<div style="font-size:120px;filter:drop-shadow(0 0 30px #f00)">${F.e}</div>`}</div>
    <div class="blog">${B.log}</div>
    <div id="bt-p" class="row" style="margin:8px 0"><div class="por-mini">${portrait('hero',B.php<B.pmax*.3?'a':'k',{noGlow:1})}</div><div class="grow"><b>${S.name}</b> ${B.might?'💪':''}${B.stone?'🪨':''}${B.dodge?'🌑':''}<div class="hpbar me"><i style="width:${B.php/B.pmax*100}%"></i></div><div class="mut">${Math.max(0,B.php)} / ${B.pmax}</div></div></div>
    <div class="grid g2" style="max-height:34vh;overflow-y:auto">${acts.join('')}</div>`;
    $$('[data-a]',m).forEach(b=>b.onclick=()=>act(b.dataset.a))}
  async function act(a){if(B.busy)return;B.busy=true;let msg='';
    if(a==='hit'){let d=Math.round((ri(8,14)+S.level*1.3)*dmgMult());const cr=chance(.13);if(cr)d=Math.round(d*1.8);B.ehp-=d;pop((cr?'КРИТ! ':'')+d,cr?'crit':'','e');sfx('hit');hap(cr?'heavy':'medium');msg=cr?`Сокрушительный удар! ${d} урона.`:`Ты бьёшь на ${d}.`}
    else if(a.startsWith('e:')){const rid=a.slice(2);const q=bestElix(rid);invAdd(rid+'#'+q,-1);const e=RECIPES[rid].bat;const qm=1+q*.15;
      if(e.heal){const h=Math.min(B.pmax-B.php,Math.round(e.heal*qm));B.php+=h;pop('+'+h,'heal','p');sfx('heal');msg=`${RECIPES[rid].n}: +${h} здоровья.`}
      if(e.dmg){const d=Math.round(ri(e.dmg[0],e.dmg[1])*qm*(1+T('phoenix')*.12));B.ehp-=d;pop(d,'crit','e');sfx('boom');hap('heavy');msg=`${RECIPES[rid].n}! ${d} урона.`}
      if(e.smoke){B.smoke=2;msg='Облако едкого дыма! Враг ничего не видит.'}if(e.might){B.might=e.might;msg='Сила богатыря наполняет мышцы!'}if(e.stone){B.stone=e.stone;msg='Кожа твердеет, как гранит.'}
      if(e.dodge){B.dodge=e.dodge;msg='Ты сливаешься с тенью.'}if(e.stun){B.stun=e.stun;msg+=' Враг оглушён!'}}
    else if(a.startsWith('g:')){const g=a.slice(2);B.used[g]=1;sfx('heart');
      if(g==='aira'){const d=ri(30,40);B.ehp-=d;pop(d,'crit','e');msg=`Айра врывается алым вихрем: «Не смей трогать моего алхимика!» ${d} урона.`}
      if(g==='seylin'){let t=0;for(let i=0;i<3;i++)t+=ri(10,14);B.ehp-=t;pop(t,'crit','e');msg=`Три стрелы Сэйлин поют в воздухе. ${t} урона.`}
      if(g==='velena'){B.hex=4;msg='Велена шепчет проклятие. Враг слабеет на глазах.'}
      if(g==='liora'){B.stun=2;msg='Лиора швыряет горсть золотой пыли врагу в глаза: «За счёт заведения!»'}}
    else if(a==='run'){if(chance(.6+(hasBook('b_kolobok')?.3:0))){OV.close(m);toast('Ты сбежал. Колобок бы гордился.');onEnd&&onEnd(false);return}msg='Сбежать не удалось!'}
    B.log=msg;if(B.might)B.might--;render();await sleepMs(650);
    if(B.ehp<=0){return finish(true)}
    B.turn++;let em='';
    if(B.stun){B.stun--;em='Враг приходит в себя...'}
    else if(B.smoke&&chance(.75)){em='Враг бьёт мимо, кашляя в дыму.'}
    else if(B.dodge&&chance(.7)){em='Удар проходит сквозь тень.'}
    else{let d,sp=false;if(F.sp&&B.turn%F.sp.every===0){d=ri(F.sp.dmg[0],F.sp.dmg[1]);sp=true}else d=ri(F.atk[0],F.atk[1]);if(B.hex)d=Math.round(d*.6);if(B.stone)d=Math.round(d*.5);B.php-=d;pop(d,'','p');sfx('hit');hap('heavy');$('#bt',m).classList.add('shake');setTimeout(()=>$('#bt',m)&&$('#bt',m).classList.remove('shake'),500);em=sp?`${F.sp.t} ${d} урона!`:`${F.n} бьёт на ${d}.`}
    if(B.smoke)B.smoke--;if(B.dodge)B.dodge--;if(B.stone)B.stone--;if(B.hex)B.hex--;
    B.log=msg+'<br>'+em;B.busy=false;render();if(B.php<=0)return finish(false)}

 el.innerHTML=`<div class="banner">${homeBanner()}<div class="ov"><div class="serif" style="font-size:19px;text-shadow:0 2px 6px #000">Усадьба алхимика</div><div class="small" style="text-shadow:0 1px 4px #000;color:#f4e6c8">${CAULDRON[S.cauldron].n}${S.cat?' · 🐈 Барсик что-то принёс!':''}</div></div></div>
 ${mq?questCard(mq,true):''}
 <div class="quick"><button class="qb" data-q="brew"><span class="em">⚗️</span><span>Котёл</span></button>
  <button class="qb" data-q="chests"><span class="em">📦</span><span>Сундуки</span>${chestN?`<span class="badge">${chestN}</span>`:''}</button>
  <button class="qb" data-q="wheel"><span class="em">🎡</span><span>Фортуна</span>${wheelFree()?'<span class="badge">!</span>':invHas('token')?`<span class="badge">${invCount('token')}</span>`:''}</button>
  <button class="qb" data-q="cat"><span class="em">🐈</span><span>Барсик</span>${S.cat?'<span class="badge">🎁</span>':''}</button></div>
 <div class="card"><div class="row" style="margin-bottom:8px"><h3 class="t grow" style="margin:0">🌱 Огород</h3><button class="btn sm sec" data-q="water">💧 Полить (1⚡)</button>${S.plots.some(plotReady)?'<button class="btn sm" data-q="harvestall">Собрать всё</button>':''}</div>
  <div class="plots">${S.plots.map((p,i)=>plotHTML(p,i)).join('')}${[...Array(Math.max(0,12-S.plots.length))].map(()=>`<div class="plot lock">🔒</div>`).join('').slice(0,0)}</div>
  <div class="mut" style="margin-top:6px">Полей грядки — без воды ничего не растёт. Дождь поливает сам. Иногда урожай мутирует ✨</div></div>
 ${S.flags.relicHint?'':''}
 <button class="btn wide" data-q="sleep" style="margin-top:6px;padding:14px">🌙 Лечь спать — новый день</button>`;
 $$('[data-q]',el).forEach(b=>b.onclick=()=>{sfx('click');hap();homeAct(b.dataset.q)});
 $$('[data-plot]',el).forEach(b=>b.onclick=()=>plotTap(+b.dataset.plot));bindQuestCard(el)}
function plotHTML(p,i){if(!p)return `<div class="plot" data-plot="${i}"><span style="font-size:20px;opacity:.5">＋</span></div>`;const c=CROPS[p.s];const ready=plotReady(p);const pr=p.d/c.d;
 const em=ready?c.e:pr<.34?'🌱':pr<.67?'🌿':'🪴';return `<div class="plot ${p.w&&!ready?'wet':''} ${ready?'ready':''}" data-plot="${i}">${em}${p.zap?'<span class="mutf">⚡</span>':''}<span class="st">${ready?'Готово!':`${p.d}/${c.d} дн${p.w?' 💧':''}`}</span></div>`}
function plotTap(i){const p=S.plots[i];if(!p){seedPicker(i);return}if(plotReady(p)){const r=harvest(i);if(!r)return;sfx(r.mut?'rare':'good');hap(r.mut?'success':'light');
  if(r.mut){burst(innerWidth/2,innerHeight/2,'#ffb733',30);toast(`✨ МУТАЦИЯ! ${ITEMS[r.mut].e} ${ITEMS[r.mut].n}`,'leg')}toast(`+${r.n} ${ITEMS[r.prod].e} ${ITEMS[r.prod].n}`);Save.write();render();return}
  if(!p.w){p.w=true;sfx('click');toast('💧 Полито');Save.write();render()}else toast(`${CROPS[p.s].n.replace('Семена ','')}: растёт (${p.d}/${CROPS[p.s].d} дн.)`)}
function seedPicker(i){const seeds=Object.keys(S.inv).filter(k=>CROPS[k]);if(!seeds.length){toast('Нет семян — купи в лавке на рынке','bad');return}
 const m=OV.open(`<h2 class="t">Что посадить?</h2><div class="grid g3">${seeds.map(k=>{const c=CROPS[k];return tileItem(c.e,c.n.replace('Семена ','').replace('Саженец ','').replace('Луковица ',''),invCount(k),ITEMS[k].r,`data-s="${k}"`).replace('</div></div>',`<div class="mut small">${c.d} дн.</div></div></div>`)}).join('')}</div>${seeds.length?`<button class="btn sec wide" style="margin-top:10px" data-all>Засадить все пустые грядки</button>`:''}`);
 $$('[data-s]',m).forEach(b=>b.onclick=()=>{plant(i,b.dataset.s);OV.close(m);Save.write();render()});
 $('[data-all]',m).onclick=()=>{let si=0;S.plots.forEach((p,j)=>{if(p)return;while(si<seeds.length&&!invHas(seeds[si]))si++;if(si<seeds.length)plant(j,seeds[si])});OV.close(m);Save.write();render()}}
function homeAct(a){
 if(a==='brew')return brewUI();if(a==='chests')return chestList();if(a==='wheel')return wheelUI();if(a==='water'){waterAll();Save.write();return render()}
 if(a==='harvestall'){let mutants=[];let tot=0;S.plots.forEach((p,i)=>{if(plotReady(p)){const r=harvest(i);tot+=r.n;if(r.mut)mutants.push(r.mut)}});sfx(mutants.length?'rare':'good');
  if(mutants.length){burst(innerWidth/2,innerHeight/2,'#ffb733',30);mutants.forEach(k=>toast(`✨ МУТАЦИЯ! ${ITEMS[k].e} ${ITEMS[k].n}`,'leg'))}toast(`Собрано: ${tot}`);Save.write();return render()}
 if(a==='cat'){if(!S.cat){toast(pick(['Барсик спит. Не буди.','Барсик смотрит на тебя как на табуретку.','Мяу. (Барсик ничего не принёс)','Барсик гоняет муху. Муха побеждает.']));return}
  const it=S.cat;S.cat=null;applyLoot([it]);sfx(it.r>=3?'rare':'good');showLoot('Барсик принёс подарок!',[it]);Save.write();return}
 if(a==='sleep')return sleepNow()}
async function sleepNow(){const unready=S.plots.filter(p=>p&&!p.w&&!plotReady(p)).length;if(unready&&S.weather!=='дождь'){if(!await confirmBox(`Не полито грядок: ${unready}. Они не вырастут за ночь. Всё равно спать?`,'Спать','Полить'))return}
 const m=OV.open('<div style="position:absolute;inset:0;background:#000;display:grid;place-items:center;pointer-events:auto;animation:fadein .6s"><div class="serif" style="font-size:22px;color:#d8b98a">🌙 Ночь...</div></div>',{full:true});
 await sleepMs(900);const rep=newDay();OV.close(m);morning(rep);render()}
function morning(rep){const ev=MEVENTS.find(e=>e.id===S.market.ev);const lines=[];
 lines.push(`${WEATHER_IC[S.weather]} Погода: <b>${S.weather}</b>${S.weather==='гроза'?' — шанс мутаций ×2!':S.weather==='звездопад'?' — удача +10%!':S.weather==='туман'?' — на вылазках больше находок и событий':S.weather==='дождь'?' — огород полит':''}`);
 if(isFull())lines.push('🌕 <b>Полнолуние.</b> Ночью в лесу может случиться что угодно...');
 if(rep.zap)lines.push(`⚡ Молния ударила в грядку (${rep.zap})! Урожай точно мутирует.`);
 if(ev)lines.push(`📢 Рынок: <b>${ev.t}</b>. ${ev.d}`);if(S.market.wander)lines.push('🐫 В деревню приехал <b>Ходжа</b> с диковинками! (Рынок)');
 if(S.cat)lines.push('🐈 Барсик что-то притащил и сидит с гордым видом.');if(rep.egg)lines.push(`🐔 Курочка Ряба снесла ${rep.egg} яйцо${rep.egg==='золотое'?' (+250💰)':''}.`);
 if(rep.forecast)lines.push(`🔮 Велена шепчет: завтра на рынке — «${rep.forecast}».`);if(rep.ready)lines.push(`🌾 Созрело грядок: ${rep.ready}`);
 if(wheelFree())lines.push('🎡 Колесо Фортуны ждёт бесплатного вращения!');
 OV.open(`<div class="serif" style="font-size:26px;color:var(--gold2);text-align:center">День ${S.day}</div><div class="sep"></div><div class="col" style="gap:8px">${lines.map(l=>`<div>${l}</div>`).join('')}</div><button class="btn wide" style="margin-top:14px" data-x>Начать день ⚡${S.energy}</button>`,{center:true})}

// ---------- quest card ----------
function questCard(q,compact){const st=S.quests[q.id];const ready=questReady(q.id);const objs=q.objs.map((o,i)=>{const [c,n]=objProg(q,i);return `<li class="${c>=n?'ok':''}"><span>${o.l}</span><span>${o.t==='pay'||o.t==='earn'?fmt(c)+'/'+fmt(n):o.t==='lvl'?c+'/'+n:c+'/'+n}</span></li>`}).join('');
 const acts=[];if(ready)acts.push(`<button class="btn wide" data-turnin="${q.id}">✦ Завершить задание</button>`);
 q.objs.forEach((o,i)=>{const [c,n]=objProg(q,i);if(c>=n)return;if(o.t==='fight')acts.push(`<button class="btn red wide" data-fight="${o.foe}">⚔️ Начать бой</button>`);if(o.t==='card'&&o.opp==='aira')acts.push(`<button class="btn wide" data-cardq="aira">🃏 Сыграть с Айрой</button>`);if(o.t==='card'&&o.opp==='baron'){const [c0,n0]=objProg(q,0);acts.push(`<button class="btn wide" data-cardq="baron" ${c0<n0?'disabled':''}>🏰 К барону ${c0<n0?'(сначала «Боярышник»)':''}</button>`)}});
 return `<div class="card glow"><div class="row"><span class="tag g">Глава ${q.ch}</span><b class="serif grow" style="font-size:16px">${q.t}</b></div>${compact?'':`<div class="mut" style="margin-top:4px">${q.d}</div>`}<ul class="objs">${objs}</ul>${acts.length?`<div class="col" style="margin-top:6px">${acts.join('')}</div>`:''}</div>`}
function bindQuestCard(el){$$('[data-turnin]',el).forEach(b=>b.onclick=()=>completeQuest(b.dataset.turnin));
 $$('[data-fight]',el).forEach(b=>b.onclick=()=>{const q=currentMain();if(q&&q.s&&!S.seen['f_'+q.id]){S.seen['f_'+q.id]=1}startBattle(b.dataset.fight,()=>render())});
 $$('[data-cardq]',el).forEach(b=>b.onclick=()=>{const o=b.dataset.cardq;const go=()=>startCards(o,()=>render());if(o==='baron'&&!S.seen.baron){S.seen.baron=1;playScene('baron_meet',go)}else go()})}
function completeQuest(id){const q=QMAP[id];const out=turnIn(id);if(!out)return;sfx('legend');hap('success');Save.write();
 const after=()=>showLoot('Задание выполнено!',out,()=>{const nx=nextMainId();if(nx&&!(id==='q15'))beginQuest(nx);Save.write();render()},q.t);
 if(q.e)playScene(q.e,after);else after()}
function beginQuest(id){startQuest(id);const q=QMAP[id];Save.write();const done=()=>{toast(`📜 Новое задание: <b>${q.t}</b>`,'gold');render()};if(q.s)playScene(q.s,done);else done()}

// ---------- dialogue ----------
function playScene(id,cb){const sc=SCENES[id];if(!sc){cb&&cb();return}playLines(sc.lines,sc.bg,cb)}
function playLines(lines,bg,cb){const m=OV.open(`<div class="vn"><div class="bg" style="background:${BGS[bg]||BGS.dark}"></div><div class="stage"></div><button class="skip">⏭ Пропустить</button><div class="box"><div class="nm" style="display:none"></div><div class="tx"></div><div class="chs"></div><span class="nx">▼</span></div></div>`,{full:true});
 const q=lines.slice();let typing=null,full='',cur=null,lastWho=null,skipping=false;const tx=$('.tx',m),nm=$('.nm',m),chs=$('.chs',m),stage=$('.stage',m),nx=$('.nx',m);
 const sub=t=>t.replace(/\{name\}/g,esc(S.name));
 function step(){if(typing){clearInterval(typing);typing=null;tx.innerHTML=full;nx.style.display='';return}
  if(chs.children.length)return;const it=q.shift();if(!it){OV.close(m);cb&&cb();return}
  if(it.fx){if(it.fx==='flash'){const f=document.createElement('div');f.className='flash';$('.vn',m).appendChild(f);setTimeout(()=>f.remove(),900);sfx('rare');hap('heavy')}if(it.fx==='shake'){$('.vn',m).classList.add('shake');setTimeout(()=>$('.vn',m).classList.remove('shake'),500);sfx('boom');hap('heavy')}if(it.fx==='fire'){$('.bg',m).style.background=BGS.fire;sfx('boom')}return step()}
  if(it.pressf){skipping=false;nm.style.display='none';stage.innerHTML='';tx.className='tx narr';tx.innerHTML='Перо на кургане чуть светится в закатном свете.';
   chs.innerHTML=`<button data-f style="text-align:center;font-size:22px;font-weight:900;letter-spacing:2px">[ F ] Отдать дань уважения</button>`;nx.style.display='none';
   $('[data-f]',m).onclick=e=>{e.stopPropagation();chs.innerHTML='';ach('pressf');tx.innerHTML='Ты отдаёшь дань уважения. Где-то очень далеко кто-то одобрительно хмыкает.';nx.style.display=''};return}
  if(it.c){skipping=false;nx.style.display='none';chs.innerHTML=it.c.map((c,i)=>`<button data-c="${i}">${sub(c.t)}</button>`).join('');
   $$('[data-c]',m).forEach(b=>b.onclick=e=>{e.stopPropagation();const c=it.c[+b.dataset.c];sfx('click');hap();for(const g in c.h||{})heart(g,c.h[g]);if(c.f)S.flags[c.f]=1;chs.innerHTML='';q.unshift(...(c.then||[]));step()});return}
  const [who,mood,text]=it;full=sub(text);
  if(who==='n'){nm.style.display='none';tx.className='tx narr';stage.innerHTML=lastWho&&lastWho!=='n'?stage.innerHTML:'';if(stage.firstChild)stage.firstChild.style.filter='brightness(.5)'}
  else{const ch=CHARS[who];nm.style.display='';nm.textContent=typeof ch.n==='function'?ch.n():ch.n;nm.style.background=`linear-gradient(180deg,#fff,${ch.col})`;tx.className='tx';
   const pid=ch.por||who;if(PC[pid]){const html=`<div class="por ${lastWho!==who?'in':''}">${portrait(pid,mood||null,{ghost:ch.ghost})}</div>`;if(lastWho!==who||cur!==mood){stage.innerHTML=html}else if(stage.firstChild)stage.firstChild.style.filter=''}else stage.innerHTML=''}
  lastWho=who;cur=mood;
  if(skipping||S.settings.fastText){tx.innerHTML=full;if(skipping)setTimeout(step,0);return}
  tx.innerHTML='';nx.style.display='none';let i=0;typing=setInterval(()=>{i+=2;tx.innerHTML=full.slice(0,i);if(i%6===0)sfx('tick');if(i>=full.length){clearInterval(typing);typing=null;tx.innerHTML=full;nx.style.display=''}},22)}
 $('.vn',m).onclick=e=>{if(e.target.closest('.skip')||e.target.closest('.chs button'))return;step()};
 $('.skip',m).onclick=e=>{e.stopPropagation();if(typing){clearInterval(typing);typing=null}skipping=true;step()};step()}

// ---------- loot display ----------
function showLoot(title,items,cb,sub){const views=items.map(it=>it.e?it:lootView(it));const maxR=Math.max(0,...views.map(v=>v.r||0));
 const m=OV.open(`<div style="text-align:center">${sub?`<div class="mut">${sub}</div>`:''}<h2 class="t" style="justify-content:center">${title}</h2>${maxR>=4?`<div class="legend-banner ${maxR>=5?'m':''}">${maxR>=5?'МИФИЧЕСКОЕ!':'ЛЕГЕНДАРНОЕ!'}</div>`:''}
  <div class="loot">${views.map((v,i)=>`<div class="tile ${RB(v.r||0)}" style="animation-delay:${i*.12}s"><div class="em">${v.e}</div><div class="nm r${v.r||0}">${v.n}</div>${v.c?`<span class="q">${v.c>0?'+':''}${fmt(v.c)}</span>`:''}</div>`).join('')}</div>
  <button class="btn wide" data-x style="margin-top:8px">Забрать</button></div>`,{center:true,onClose:cb});
 if(maxR>=4){sfx('legend');hap('success');burst(innerWidth/2,innerHeight/2,maxR>=5?'#ff4d6d':'#ffb733',40)}else if(maxR>=2)sfx('rare');else sfx('good');renderTop();return m}
function showLevelUp(){const l=pendingLevelUps.shift();if(!l)return;sfx('level');hap('success');burst(innerWidth/2,innerHeight/3,'#ffd36b',36);
 OV.open(`<div class="lvlup"><div class="mut">НОВЫЙ УРОВЕНЬ</div><div class="big">${l}</div><div class="serif" style="font-size:16px;margin:6px 0">+1 очко таланта · +2 к энергии${l%3===0?' · 🎟️ Жетон Фортуны':''}</div>${LEVEL_UNLOCK[l]?`<div class="card glow" style="margin-top:10px"><b>🔓 Открыто:</b> ${LEVEL_UNLOCK[l]}</div>`:''}<button class="btn wide" data-x style="margin-top:10px">Пламя растёт</button></div>`,{center:true,onClose:()=>{render()}})}

// ---------- brewing ----------
function brewUI(){const m=OV.open(`<h2 class="t">⚗️ ${CAULDRON[S.cauldron].n}</h2><div class="mut" style="margin:-6px 2px 10px">Зелий за варку: ${brewYield()} · Варка: 2⚡</div><div id="rl"></div>`);
 const draw_=()=>{const rl=$('#rl',m);const rec=S.recipes.slice().sort((a,b)=>(missing(a).length?1:0)-(missing(b).length?1:0)||RECIPES[a].p-RECIPES[b].p);
  const nx=CAULDRON[S.cauldron+1];
  rl.innerHTML=(rec.length?rec.map(rid=>{const r=RECIPES[rid];const mis=missing(rid);const ing=Object.entries(r.ing).map(([k,n])=>`<span class="${invCount(k)>=n?'':'dn'}">${ITEMS[k].e}${invCount(k)}/${n}</span>`).join(' ');
   return `<div class="card" style="padding:10px"><div class="row"><div style="font-size:30px">${r.e}</div><div class="grow"><b>${r.n}</b> <span class="mut">~${fmt(sellPrice(rid+'#0'))}💰</span><div class="small">${ing}</div><div class="mut small">${r.d}</div></div><button class="btn sm" data-b="${rid}" ${mis.length?'disabled':''}>Варить</button></div></div>`}).join(''):'<div class="empty">Нет рецептов</div>')
   +(S.level>=7?`<button class="btn sec wide" data-dist style="margin-top:6px">🔁 Перегонный куб (3 зелья → 1 качеством выше, 70%)</button>`:'')
   +(nx?`<div class="card" style="margin-top:10px"><b>Улучшение:</b> ${nx.n} — ${nx.y} зелья за варку<div class="mut">Нужен ${nx.lvl} ур. · ${fmt(Math.round(nx.cost*(hasBook('b_steel')?.75:1)))}💰</div><button class="btn sm" data-up style="margin-top:6px" ${S.level<nx.lvl?'disabled':''}>Улучшить котёл</button></div>`:'');
  $$('[data-b]',m).forEach(b=>b.onclick=()=>{if(S.energy<2){toast('Не хватает энергии ⚡','bad');return}brewGame(b.dataset.b,()=>{draw_();render()})});
  const up=$('[data-up]',m);if(up)up.onclick=()=>{upgradeCauldron();Save.write();draw_();render()};const ds=$('[data-dist]',m);if(ds)ds.onclick=()=>distillUI(draw_)};draw_()}
function brewGame(rid,done){const r=RECIPES[rid];S.energy-=2;
 const goodW=.18+T('steady')*.03,perfW=.045+T('steady')*.015;const gs=.15+rnd()*(.7-goodW);const ps=gs+rnd()*(goodW-perfW);const speed=(.75+Math.min(1.1,r.p/900))*(S.level<3?.8:1);
 const m=OV.open(`<div class="cauldron-wrap"><div class="serif" style="font-size:18px">${r.e} ${r.n}</div><div class="mut">Останови стрелку в <b style="color:#5fd068">зелёной</b> зоне. <b style="color:#ffd36b">Золотая</b> — идеально!</div>
  <div class="bubbles" id="cb">${cauldronSVG()}</div>
  <div class="meter"><div class="z" style="left:0;width:12%;background:#5a1a1a"></div><div class="z" style="right:0;width:12%;background:#5a1a1a"></div><div class="z" style="left:12%;right:12%;background:#2a2433"></div>
   <div class="z" style="left:${gs*100}%;width:${goodW*100}%;background:linear-gradient(180deg,#3fbf6a,#1f7a3a)"></div><div class="z" style="left:${ps*100}%;width:${perfW*100}%;background:linear-gradient(180deg,#fff3a0,#e8b85a);box-shadow:0 0 12px #ffd36b"></div><div class="needle" id="nd"></div></div>
  <button class="btn wide" id="pour" style="padding:16px;font-size:18px">ВЛИТЬ!</button><div id="res"></div></div>`,{center:true,noClose:true});
 let pos=0,dir=1,run=true,last=performance.now();const nd=$('#nd',m);sfx('brew');
 const loop=t=>{if(!run)return;const dt=Math.min(50,t-last)/1000;last=t;pos+=dir*speed*dt;if(pos>1){pos=1;dir=-1}if(pos<0){pos=0;dir=1}nd.style.left=(pos*100)+'%';requestAnimationFrame(loop)};requestAnimationFrame(loop);
 $('#pour',m).onclick=async()=>{if(!run)return;run=false;hap('medium');const zone=pos<.12||pos>.88?-1:(pos>=ps&&pos<=ps+perfW)?2:(pos>=gs&&pos<=gs+goodW)?1:0;
  $('#pour',m).style.display='none';const zt=['Мимо!','Сойдёт','Хорошо!','ИДЕАЛЬНО!'][zone+1];toast(zt,zone===2?'gold':zone<0?'bad':'');
  $('#cb',m).classList.add('shake');sfx('brew');await sleepMs(900);const res=brewRoll(rid,zone);Save.write();
